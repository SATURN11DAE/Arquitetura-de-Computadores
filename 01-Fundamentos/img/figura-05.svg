<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <text x="350" y="28" fill="#00f2fe" font-size="16" font-weight="bold" text-anchor="middle">Desempenho relativo por unidade de custo</text> <text x="350" y="47" fill="#a0aec0" font-size="12" text-anchor="middle">(escala logarítmica)</text> <text x="15" y="78" fill="#e2e8f0" font-size="14">1951 · Válvula a vácuo</text> <rect x="215" y="55" width="8" height="34" fill="#00f2fe" rx="4"/> <text x="233" y="78" fill="#00f2fe" font-size="14" font-weight="bold">1×</text> <text x="15" y="128" fill="#e2e8f0" font-size="14">1965 · Transistor</text> <rect x="215" y="105" width="47" height="34" fill="#50fa7b" rx="4"/> <text x="272" y="128" fill="#50fa7b" font-size="14" font-weight="bold">35×</text> <text x="15" y="178" fill="#e2e8f0" font-size="14">1975 · Circuito integrado</text> <rect x="215" y="155" width="90" height="34" fill="#f1fa8c" rx="4"/> <text x="315" y="178" fill="#f1fa8c" font-size="14" font-weight="bold">900×</text> <text x="15" y="228" fill="#e2e8f0" font-size="14">1995 · VLSI</text> <rect x="215" y="205" width="193" height="34" fill="#ffb86c" rx="4"/> <text x="418" y="228" fill="#ffb86c" font-size="14" font-weight="bold">2.400.000×</text> <text x="15" y="278" fill="#e2e8f0" font-size="14">2013 · ULSI</text> <rect x="215" y="255" width="345" height="34" fill="#ff79c6" rx="4"/> <text x="570" y="278" fill="#ff79c6" font-size="14" font-weight="bold">250.000.000.000×</text> <text x="350" y="318" fill="#a0aec0" font-size="12" text-anchor="middle">Em escala log, o tamanho da barra cresce com a ordem de grandeza,</text> <text x="350" y="334" fill="#a0aec0" font-size="12" text-anchor="middle">e não com o valor absoluto.</text> </svg>
