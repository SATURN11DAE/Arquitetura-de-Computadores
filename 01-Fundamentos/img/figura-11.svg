<svg viewBox="0 0 820 170" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <rect x="15" y="30" width="170" height="90" fill="#1e1e2e" stroke="#50fa7b" stroke-width="2" rx="8"/> <text x="100" y="62" fill="#50fa7b" font-size="13" font-weight="bold" text-anchor="middle">Clock ↑</text> <text x="100" y="84" fill="#a0aec0" font-size="11" text-anchor="middle">mais chaveamentos</text> <text x="100" y="100" fill="#a0aec0" font-size="11" text-anchor="middle">por segundo</text> <polygon points="190,70 212,70 212,64 226,75 212,86 212,80 190,80" fill="#a0aec0"/> <rect x="230" y="30" width="170" height="90" fill="#1e1e2e" stroke="#ffb86c" stroke-width="2" rx="8"/> <text x="315" y="62" fill="#ffb86c" font-size="13" font-weight="bold" text-anchor="middle">Potência ↑</text> <text x="315" y="84" fill="#a0aec0" font-size="11" text-anchor="middle">mais calor para</text> <text x="315" y="100" fill="#a0aec0" font-size="11" text-anchor="middle">dissipar</text> <polygon points="405,70 427,70 427,64 441,75 427,86 427,80 405,80" fill="#a0aec0"/> <rect x="445" y="30" width="170" height="90" fill="#1e1e2e" stroke="#ff5555" stroke-width="2" rx="8"/> <text x="530" y="62" fill="#ff5555" font-size="13" font-weight="bold" text-anchor="middle">Limite de</text> <text x="530" y="80" fill="#ff5555" font-size="13" font-weight="bold" text-anchor="middle">refrigeração</text> <text x="530" y="102" fill="#a0aec0" font-size="11" text-anchor="middle">custo e viabilidade</text> <polygon points="620,70 642,70 642,64 656,75 642,86 642,80 620,80" fill="#a0aec0"/> <rect x="660" y="30" width="150" height="90" fill="#282a36" stroke="#bd93f9" stroke-width="2" rx="8"/> <text x="735" y="62" fill="#bd93f9" font-size="13" font-weight="bold" text-anchor="middle">Power Wall</text> <text x="735" y="84" fill="#a0aec0" font-size="11" text-anchor="middle">fim da escalada</text> <text x="735" y="100" fill="#a0aec0" font-size="11" text-anchor="middle">do clock</text> <text x="410" y="152" fill="#cbd5e0" font-size="11" text-anchor="middle">A saída antiga (baixar a tensão) esbarra no vazamento: transistores "vazados" demais.</text> </svg>
