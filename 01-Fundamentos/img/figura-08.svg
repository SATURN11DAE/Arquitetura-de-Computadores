<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 230" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <!-- Título --> <text x="410" y="24" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">Onde vai o tempo de um programa?</text> <!-- Chave: Tempo de CPU --> <path d="M 30,78 L 30,68 L 390,68 L 390,78" fill="none" stroke="#50fa7b" stroke-width="2"/> <text x="210" y="58" fill="#50fa7b" font-size="12" font-weight="bold" text-anchor="middle">Tempo de CPU (CPU execution time)</text> <!-- Segmentos --> <rect x="30" y="85" width="220" height="55" fill="#8be9fd" rx="4"/> <text x="140" y="108" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">User CPU time</text> <text x="140" y="125" fill="#181a26" font-size="10" text-anchor="middle">CPU no código do programa</text> <rect x="250" y="85" width="140" height="55" fill="#bd93f9" rx="4"/> <text x="320" y="108" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">System CPU time</text> <text x="320" y="125" fill="#181a26" font-size="10" text-anchor="middle">CPU no SO, pelo programa</text> <rect x="390" y="85" width="200" height="55" fill="#ffb86c" rx="4"/> <text x="490" y="108" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">Espera de I/O</text> <text x="490" y="125" fill="#181a26" font-size="10" text-anchor="middle">disco, rede, etc.</text> <rect x="590" y="85" width="200" height="55" fill="#ff79c6" rx="4"/> <text x="690" y="108" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">Outros programas</text> <text x="690" y="125" fill="#181a26" font-size="10" text-anchor="middle">CPU compartilhada</text> <!-- Chave: Tempo decorrido --> <path d="M 30,152 L 30,162 L 790,162 L 790,152" fill="none" stroke="#00f2fe" stroke-width="2"/> <text x="410" y="184" fill="#00f2fe" font-size="12" font-weight="bold" text-anchor="middle">Tempo decorrido (wall clock time = elapsed time = tempo de resposta)</text> <text x="410" y="206" fill="#a0aec0" font-size="10" text-anchor="middle">É o tempo que o usuário realmente percebe</text> </svg>
