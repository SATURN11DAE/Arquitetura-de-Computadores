<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 650 180" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: sans-serif; background: #181a26; border-radius: 8px; padding: 10px;">
  <!-- Frame Buffer (Memória) -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="160" height="140" fill="#1e1e2e" stroke="#50fa7b" stroke-width="1.5" rx="6"/>
    <text x="80" y="20" fill="#50fa7b" font-size="12" font-weight="bold" text-anchor="middle">Frame Buffer (RAM)</text>
    <!-- Pixeis em bits -->
    <rect x="25" y="40" width="50" height="35" fill="#282a36" stroke="#444" />
    <text x="50" y="62" fill="#f1fa8c" font-size="11" font-weight="bold" text-anchor="middle">0011</text>
    <rect x="85" y="85" width="50" height="35" fill="#282a36" stroke="#444" />
    <text x="110" y="107" fill="#f1fa8c" font-size="11" font-weight="bold" text-anchor="middle">1101</text>
    <text x="50" y="90" fill="#a0aec0" font-size="9" text-anchor="middle">(X0, Y0)</text>
    <text x="110" y="135" fill="#a0aec0" font-size="9" text-anchor="middle">(X1, Y1)</text>
  </g>
  <!-- Seta de Leitura -->
  <g transform="translate(210, 80)">
    <path d="M 0,0 L 60,0" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,2" />
    <polygon points="60,-5 70,0 60,5" fill="#00f2fe" />
    <text x="35" y="-10" fill="#00f2fe" font-size="10" text-anchor="middle">Refresh Rate</text>
  </g>
  <!-- Display (Ecrã) -->
  <g transform="translate(300, 20)">
    <rect x="0" y="0" width="300" height="140" fill="#1e1e2e" stroke="#00f2fe" stroke-width="1.5" rx="6"/>
    <text x="150" y="20" fill="#00f2fe" font-size="12" font-weight="bold" text-anchor="middle">Display Matriz Ativa (Pixels)</text>
    <!-- Matriz de Pixeis no Ecrã -->
    <rect x="50" y="40" width="40" height="35" fill="#8be9fd" rx="2"/>
    <text x="70" y="90" fill="#a0aec0" font-size="9" text-anchor="middle">Tom Claro (0011)</text>
    <rect x="170" y="85" width="40" height="35" fill="#bd93f9" rx="2"/>
    <text x="190" y="135" fill="#a0aec0" font-size="9" text-anchor="middle">Tom Escuro (1101)</text>
  </g>
</svg>
