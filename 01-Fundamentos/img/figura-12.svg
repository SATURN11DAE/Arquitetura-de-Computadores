<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <text x="410" y="24" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">Crescimento anual do desempenho de uniprocessadores (Figura 1.17)</text> <g stroke="#2d3047" stroke-width="1"> <line x1="80" y1="60" x2="760" y2="60"/><line x1="80" y1="110" x2="760" y2="110"/> <line x1="80" y1="160" x2="760" y2="160"/><line x1="80" y1="210" x2="760" y2="210"/> <line x1="80" y1="260" x2="760" y2="260"/> </g> <g fill="#a0aec0" font-size="9" text-anchor="end"> <text x="74" y="263">0%</text><text x="74" y="213">20%</text><text x="74" y="163">40%</text><text x="74" y="113">60%</text> </g> <!-- escala: 2,5 px por 1% --> <rect x="150" y="197.5" width="140" height="62.5" fill="#ffb86c" rx="4"/> <rect x="340" y="130" width="140" height="130" fill="#50fa7b" rx="4"/> <rect x="530" y="205" width="140" height="55" fill="#ff5555" rx="4"/> <g font-size="14" font-weight="bold" text-anchor="middle"> <text x="220" y="190" fill="#ffb86c">≈ 25%/ano</text> <text x="410" y="122" fill="#50fa7b">≈ 52%/ano</text> <text x="600" y="197" fill="#ff5555">≈ 22%/ano</text> </g> <g fill="#cbd5e0" font-size="11" text-anchor="middle"> <text x="220" y="278">Até meados dos</text><text x="220" y="292">anos 1980</text> <text x="410" y="278">Meados dos anos 1980</text><text x="410" y="292">até 2002</text> <text x="600" y="278">Desde 2002</text><text x="600" y="292">(power wall)</text> </g> </svg>
