<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 240" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <rect x="2" y="20" width="155" height="66" fill="#1e1e2e" stroke="#00f2fe" stroke-width="2" rx="8"/> <text x="79.5" y="48" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">1. Lingote de silício</text> <text x="79.5" y="69" fill="#cbd5e0" font-size="12" text-anchor="middle">8–12 pol de diâmetro</text> <line x1="157" y1="53" x2="173" y2="53" stroke="#a0aec0" stroke-width="2"/> <polygon points="171,47 183,53 171,59" fill="#a0aec0"/> <rect x="183" y="20" width="155" height="66" fill="#1e1e2e" stroke="#50fa7b" stroke-width="2" rx="8"/> <text x="260.5" y="48" fill="#50fa7b" font-size="14" font-weight="bold" text-anchor="middle">2. Fatiador</text> <text x="260.5" y="69" fill="#cbd5e0" font-size="12" text-anchor="middle">Wafers em branco</text> <line x1="338" y1="53" x2="354" y2="53" stroke="#a0aec0" stroke-width="2"/> <polygon points="352,47 364,53 352,59" fill="#a0aec0"/> <rect x="364" y="20" width="155" height="66" fill="#1e1e2e" stroke="#f1fa8c" stroke-width="2" rx="8"/> <text x="441.5" y="48" fill="#f1fa8c" font-size="14" font-weight="bold" text-anchor="middle">3. 20 a 40 etapas</text> <text x="441.5" y="69" fill="#cbd5e0" font-size="12" text-anchor="middle">Wafers padronizados</text> <line x1="519" y1="53" x2="535" y2="53" stroke="#a0aec0" stroke-width="2"/> <polygon points="533,47 545,53 533,59" fill="#a0aec0"/> <rect x="545" y="20" width="155" height="66" fill="#1e1e2e" stroke="#ffb86c" stroke-width="2" rx="8"/> <text x="622.5" y="48" fill="#ffb86c" font-size="14" font-weight="bold" text-anchor="middle">4. Teste do wafer</text> <text x="622.5" y="69" fill="#cbd5e0" font-size="12" text-anchor="middle">Mapa dos dies bons</text> <rect x="2" y="140" width="155" height="66" fill="#1e1e2e" stroke="#ff79c6" stroke-width="2" rx="8"/> <text x="79.5" y="168" fill="#ff79c6" font-size="14" font-weight="bold" text-anchor="middle">5. Cortador</text> <text x="79.5" y="189" fill="#cbd5e0" font-size="12" text-anchor="middle">Separa os dies</text> <line x1="157" y1="173" x2="173" y2="173" stroke="#a0aec0" stroke-width="2"/> <polygon points="171,167 183,173 171,179" fill="#a0aec0"/> <rect x="183" y="140" width="155" height="66" fill="#1e1e2e" stroke="#bd93f9" stroke-width="2" rx="8"/> <text x="260.5" y="168" fill="#bd93f9" font-size="14" font-weight="bold" text-anchor="middle">6. Bonding</text> <text x="260.5" y="189" fill="#cbd5e0" font-size="12" text-anchor="middle">Die ligado ao pacote</text> <line x1="338" y1="173" x2="354" y2="173" stroke="#a0aec0" stroke-width="2"/> <polygon points="352,167 364,173 352,179" fill="#a0aec0"/> <rect x="364" y="140" width="155" height="66" fill="#1e1e2e" stroke="#8be9fd" stroke-width="2" rx="8"/> <text x="441.5" y="168" fill="#8be9fd" font-size="14" font-weight="bold" text-anchor="middle">7. Teste final</text> <text x="441.5" y="189" fill="#cbd5e0" font-size="12" text-anchor="middle">Checa o empacotamento</text> <line x1="519" y1="173" x2="535" y2="173" stroke="#a0aec0" stroke-width="2"/> <polygon points="533,167 545,173 533,179" fill="#a0aec0"/> <rect x="545" y="140" width="155" height="66" fill="#1e1e2e" stroke="#50fa7b" stroke-width="2" rx="8"/> <text x="622.5" y="168" fill="#50fa7b" font-size="14" font-weight="bold" text-anchor="middle">8. Envio</text> <text x="622.5" y="189" fill="#cbd5e0" font-size="12" text-anchor="middle">Peça ao cliente</text> <path d="M 622.5,86 L 622.5,113 L 79.5,113 L 79.5,128" fill="none" stroke="#a0aec0" stroke-width="2"/> <polygon points="73.5,126 79.5,138 85.5,126" fill="#a0aec0"/> <text x="350" y="228" fill="#a0aec0" font-size="13" text-anchor="middle">Do lingote de silício até a peça enviada ao cliente.</text> </svg>
