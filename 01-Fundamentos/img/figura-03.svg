<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 260" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;">
  <!-- Nível 1: Topo (Cache) -->
  <polygon points="420,30 360,90 480,90" fill="#ff79c6" stroke="#181a26" stroke-width="2"/>
  <text x="420" y="72" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">Cache (SRAM)</text>
  <!-- Nível 2: Meio (DRAM) -->
  <polygon points="360,90 480,90 550,160 290,160" fill="#00f2fe" stroke="#181a26" stroke-width="2"/>
  <text x="420" y="132" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">Memória Principal (DRAM)</text>
  <!-- Nível 3: Base (Secundária) -->
  <polygon points="290,160 550,160 620,230 220,230" fill="#bd93f9" stroke="#181a26" stroke-width="2"/>
  <text x="420" y="202" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">Memória Secundária (Flash / Disco)</text>
  <!-- Seta Esquerda (VERMELHA / PARA CIMA) -->
  <line x1="130" y1="220" x2="130" y2="45" stroke="#ff5555" stroke-width="3"/>
  <polygon points="130,30 122,48 138,48" fill="#ff5555"/>
  <text x="115" y="115" fill="#ff5555" font-size="11" font-weight="bold" text-anchor="end">▲ Mais Rápida</text>
  <text x="115" y="135" fill="#ff79c6" font-size="10" text-anchor="end">▲ Maior Custo por Bit</text>
  <text x="115" y="155" fill="#a0aec0" font-size="9" text-anchor="end">Menos Espaço</text>
  <!-- Seta Direita (VERDE / PARA BAIXO) -->
  <line x1="710" y1="40" x2="710" y2="215" stroke="#50fa7b" stroke-width="3"/>
  <polygon points="710,230 702,212 718,212" fill="#50fa7b"/>
  <text x="725" y="115" fill="#50fa7b" font-size="11" font-weight="bold" text-anchor="start">▼ Maior Capacidade</text>
  <text x="725" y="135" fill="#50fa7b" font-size="10" text-anchor="start">▼ Menor Custo por Bit</text>
  <text x="725" y="155" fill="#a0aec0" font-size="9" text-anchor="start">Acesso Mais Lento</text>
</svg>
