<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <text x="410" y="22" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">Clock e potência: Intel x86 (1982–2012)</text> <!-- Legenda --> <rect x="300" y="32" width="10" height="10" fill="#00f2fe" rx="2"/> <text x="316" y="41" fill="#00f2fe" font-size="10">Taxa de clock (MHz, escala log)</text> <rect x="500" y="32" width="10" height="10" fill="#ff79c6" rx="2"/> <text x="516" y="41" fill="#ff79c6" font-size="10">Potência (W)</text> <!-- Grades --> <g stroke="#2d3047" stroke-width="1"> <line x1="60" y1="50" x2="760" y2="50"/> <line x1="60" y1="100" x2="760" y2="100"/> <line x1="60" y1="150" x2="760" y2="150"/> <line x1="60" y1="200" x2="760" y2="200"/> <line x1="60" y1="250" x2="760" y2="250"/> </g> <!-- Eixo esquerdo (clock, log) --> <g fill="#00f2fe" font-size="9" text-anchor="end"> <text x="54" y="253">1</text> <text x="54" y="203">10</text> <text x="54" y="153">100</text> <text x="54" y="103">1000</text> <text x="54" y="53">10.000</text> </g> <!-- Eixo direito (potência) --> <g fill="#ff79c6" font-size="9" text-anchor="start"> <text x="766" y="253">0</text> <text x="766" y="187">40</text> <text x="766" y="120">80</text> <text x="766" y="53">120</text> </g> <!-- Linhas --> <polyline points="90,195 160,190 230,180 300,159 370,135 440,85 510,72 580,79 650,74 720,73" fill="none" stroke="#00f2fe" stroke-width="2.5"/> <polyline points="90,244.5 160,243 230,242 300,233 370,201.5 440,124.5 510,78 580,92 650,105 720,122" fill="none" stroke="#ff79c6" stroke-width="2.5"/> <!-- Pontos clock --> <g fill="#00f2fe"> <circle cx="90" cy="195" r="3.5"/><circle cx="160" cy="190" r="3.5"/><circle cx="230" cy="180" r="3.5"/> <circle cx="300" cy="159" r="3.5"/><circle cx="370" cy="135" r="3.5"/><circle cx="440" cy="85" r="3.5"/> <circle cx="510" cy="72" r="3.5"/><circle cx="580" cy="79" r="3.5"/><circle cx="650" cy="74" r="3.5"/> <circle cx="720" cy="73" r="3.5"/> </g> <!-- Pontos potência --> <g fill="#ff79c6"> <circle cx="90" cy="244.5" r="3.5"/><circle cx="160" cy="243" r="3.5"/><circle cx="230" cy="242" r="3.5"/> <circle cx="300" cy="233" r="3.5"/><circle cx="370" cy="201.5" r="3.5"/><circle cx="440" cy="124.5" r="3.5"/> <circle cx="510" cy="78" r="3.5"/><circle cx="580" cy="92" r="3.5"/><circle cx="650" cy="105" r="3.5"/> <circle cx="720" cy="122" r="3.5"/> </g> <!-- Rótulos de valores --> <text x="90" y="186" fill="#00f2fe" font-size="9" text-anchor="middle">12,5 MHz</text> <text x="510" y="62" fill="#00f2fe" font-size="9" text-anchor="middle">3600</text> <text x="720" y="63" fill="#00f2fe" font-size="9" text-anchor="middle">3400</text> <text x="90" y="236" fill="#ff79c6" font-size="9" text-anchor="middle">3,3 W</text> <text x="510" y="96" fill="#ff79c6" font-size="9" text-anchor="middle">103 W</text> <text x="720" y="138" fill="#ff79c6" font-size="9" text-anchor="middle">77 W</text> <!-- Rótulos do eixo x --> <g fill="#cbd5e0" font-size="9" text-anchor="middle"> <text x="90" y="268">80286</text><text x="90" y="292" fill="#a0aec0">1982</text> <text x="160" y="268">80386</text><text x="160" y="292" fill="#a0aec0">1985</text> <text x="230" y="268">80486</text><text x="230" y="292" fill="#a0aec0">1989</text> <text x="300" y="268">Pentium</text><text x="300" y="292" fill="#a0aec0">1993</text> <text x="370" y="268">Pentium</text><text x="370" y="280">Pro</text><text x="370" y="292" fill="#a0aec0">1997</text> <text x="440" y="268">Pentium 4</text><text x="440" y="280">Willamette</text><text x="440" y="292" fill="#a0aec0">2001</text> <text x="510" y="268">Pentium 4</text><text x="510" y="280">Prescott</text><text x="510" y="292" fill="#a0aec0">2004</text> <text x="580" y="268">Core 2</text><text x="580" y="280">Kentsfield</text><text x="580" y="292" fill="#a0aec0">2007</text> <text x="650" y="268">Core i5</text><text x="650" y="280">Clarkdale</text><text x="650" y="292" fill="#a0aec0">2010</text> <text x="720" y="268">Core i5</text><text x="720" y="280">Ivy Bridge</text><text x="720" y="292" fill="#a0aec0">2012</text> </g> </svg>
