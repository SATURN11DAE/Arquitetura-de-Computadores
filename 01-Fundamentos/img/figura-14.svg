<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;"> <text x="410" y="22" fill="#00f2fe" font-size="14" font-weight="bold" text-anchor="middle">Tempo total após acelerar a multiplicação n vezes (80 s de 100 s)</text> <g stroke="#2d3047" stroke-width="1"> <line x1="60" y1="50" x2="780" y2="50"/><line x1="60" y1="150" x2="780" y2="150"/><line x1="60" y1="250" x2="780" y2="250"/> </g> <g fill="#a0aec0" font-size="9" text-anchor="end"> <text x="54" y="253">0 s</text><text x="54" y="153">50 s</text><text x="54" y="53">100 s</text> </g> <line x1="60" y1="210" x2="780" y2="210" stroke="#ff5555" stroke-width="1.5" stroke-dasharray="6 4"/> <text x="776" y="204" fill="#ff5555" font-size="10" text-anchor="end">Meta (5× mais rápido) = 20 s</text> <!-- 2 px por segundo; base y=250 --> <g> <!-- n=1: 20 (não afetado) + 80 (multiplicação) = 100 --> <rect x="95" y="210" width="70" height="40" fill="#bd93f9"/><rect x="95" y="50" width="70" height="160" fill="#ff79c6"/> <!-- n=2: 20 + 40 = 60 --> <rect x="215" y="210" width="70" height="40" fill="#bd93f9"/><rect x="215" y="130" width="70" height="80" fill="#ff79c6"/> <!-- n=4: 20 + 20 = 40 --> <rect x="335" y="210" width="70" height="40" fill="#bd93f9"/><rect x="335" y="170" width="70" height="40" fill="#ff79c6"/> <!-- n=8: 20 + 10 = 30 --> <rect x="455" y="210" width="70" height="40" fill="#bd93f9"/><rect x="455" y="190" width="70" height="20" fill="#ff79c6"/> <!-- n=16: 20 + 5 = 25 --> <rect x="575" y="210" width="70" height="40" fill="#bd93f9"/><rect x="575" y="200" width="70" height="10" fill="#ff79c6"/> <!-- n→∞: 20 --> <rect x="695" y="210" width="70" height="40" fill="#bd93f9"/> </g> <g fill="#cbd5e0" font-size="11" font-weight="bold" text-anchor="middle"> <text x="130" y="44">100 s</text><text x="250" y="124">60 s</text><text x="370" y="164">40 s</text> <text x="490" y="184">30 s</text><text x="610" y="194">25 s</text><text x="730" y="236" fill="#181a26">20 s</text> </g> <g fill="#a0aec0" font-size="11" text-anchor="middle"> <text x="130" y="270">n = 1</text><text x="250" y="270">n = 2</text><text x="370" y="270">n = 4</text> <text x="490" y="270">n = 8</text><text x="610" y="270">n = 16</text><text x="730" y="270">n → ∞</text> </g> <rect x="250" y="290" width="10" height="10" fill="#ff79c6" rx="2"/><text x="266" y="299" fill="#cbd5e0" font-size="10">Multiplicação (80/n s)</text> <rect x="440" y="290" width="10" height="10" fill="#bd93f9" rx="2"/><text x="456" y="299" fill="#cbd5e0" font-size="10">Parte não afetada (20 s, fixa)</text> </svg>
