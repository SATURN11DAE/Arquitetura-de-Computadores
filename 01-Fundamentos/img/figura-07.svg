bonding ainda há um teste final:</text> <text x="320" y="256" fill="#ffb86c" font-size="13">neste exemplo, 1 peça empacotada saiu com</text> <text x="320" y="274" fill="#ffb86c" font-size="13">defeito e foi detectada nessa etapa.</text> </svg>
