<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 245" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;">
  <!-- Camada 1: Software de Aplicação -->
  <rect x="50" y="15" width="600" height="35" fill="#1e1e2e" stroke="#50fa7b" stroke-width="1.5" rx="5"/>
  <text x="350" y="37" fill="#50fa7b" font-size="12" font-weight="bold" text-anchor="middle">Software de Aplicação (Browser, Jogos, Editor de Texto)</text>
  <!-- Camada 2: Sistema Operativo -->
  <rect x="50" y="60" width="600" height="35" fill="#1e1e2e" stroke="#ffb86c" stroke-width="1.5" rx="5"/>
  <text x="350" y="82" fill="#ffb86c" font-size="12" font-weight="bold" text-anchor="middle">Sistema Operativo (Linux, iOS, Windows)</text>
  <!-- Zona dedicada do ABI -->
  <line x1="50" y1="112" x2="600" y2="112" stroke="#ff79c6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="595" y="107" fill="#ff79c6" font-size="10" font-weight="bold" text-anchor="end">◄ ABI (Application Binary Interface)</text>
  <!-- Camada 3: ISA (Fronteira Abstrata) -->
  <rect x="50" y="125" width="600" height="35" fill="#00f2fe" rx="5"/>
  <text x="350" y="147" fill="#181a26" font-size="12" font-weight="bold" text-anchor="middle">ISA - Instruction Set Architecture (Ex: ARMv8, x86, RISC-V)</text>
  <!-- Camada 4: Múltiplas Implementações de Hardware -->
  <g transform="translate(50, 172)">
    <rect x="0" y="0" width="186" height="50" fill="#282a36" stroke="#bd93f9" stroke-width="1" rx="5"/>
    <text x="93" y="22" fill="#bd93f9" font-size="10" font-weight="bold" text-anchor="middle">Chip A5 (Tablet)</text>
    <text x="93" y="38" fill="#a0aec0" font-size="9" text-anchor="middle">Baixo Consumo / Bateria</text>
    <rect x="207" y="0" width="186" height="50" fill="#282a36" stroke="#bd93f9" stroke-width="1" rx="5"/>
    <text x="300" y="22" fill="#bd93f9" font-size="10" font-weight="bold" text-anchor="middle">Core i7 (Desktop)</text>
    <text x="300" y="38" fill="#a0aec0" font-size="9" text-anchor="middle">Alto Desempenho</text>
    <rect x="414" y="0" width="186" height="50" fill="#282a36" stroke="#bd93f9" stroke-width="1" rx="5"/>
    <text x="507" y="22" fill="#bd93f9" font-size="10" font-weight="bold" text-anchor="middle">Xeon (Servidor)</text>
    <text x="507" y="38" fill="#a0aec0" font-size="9" text-anchor="middle">Alta Confiabilidade</text>
  </g>
</svg>
