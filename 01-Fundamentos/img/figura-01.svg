<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 250" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #181a26; border-radius: 10px; padding: 10px;">
   <!-- Backlight (Luz de Fundo) -->
   <rect x="15" y="50" width="30" height="150" fill="#fffbcf" rx="4" />
   <text x="30" y="125" fill="#333" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 30 125)">Backlight (Luz)</text>
   <!-- Estado 1: Sem Corrente (Luz Passa) -->
   <g transform="translate(60, 20)">
     <rect x="0" y="0" width="340" height="210" fill="#1e1e2e" stroke="#00f2fe" stroke-width="1.5" rx="6" />
     <text x="170" y="24" fill="#00f2fe" font-size="12" font-weight="bold" text-anchor="middle">Sem Corrente = Luz Passa (Pixel Aceso)</text>
     <!-- Raio de Luz (Fundo) -->
     <line x1="0" y1="100" x2="300" y2="100" stroke="#ffb86c" stroke-width="3" />
     <circle cx="300" cy="100" r="10" fill="#ffb86c" />
     <!-- Polarizador 1 (Vertical) -->
     <rect x="30" y="50" width="20" height="100" fill="rgba(255, 121, 198, 0.1)" stroke="#ff79c6" stroke-width="2" rx="2" />
     <line x1="36" y1="52" x2="36" y2="148" stroke="#ff79c6" stroke-width="1" />
     <line x1="40" y1="52" x2="40" y2="148" stroke="#ff79c6" stroke-width="1" />
     <line x1="44" y1="52" x2="44" y2="148" stroke="#ff79c6" stroke-width="1" />
     <text x="40" y="170" fill="#a0aec0" font-size="10" font-weight="bold" text-anchor="middle">Polarizador 1 (0°)</text>
     <text x="40" y="185" fill="#a0aec0" font-size="9" text-anchor="middle">(Frestas Verticais)</text>
     <!-- Cristal -->
     <path d="M 50,100 Q 85,60 135,100 T 220,100" fill="none" stroke="#50fa7b" stroke-width="3" stroke-dasharray="4,2" />
     <text x="135" y="60" fill="#50fa7b" font-size="10" text-anchor="middle">Cristal Torcido (Dobra a Luz)</text>
     <!-- Polarizador 2 (Horizontal) -->
     <rect x="220" y="50" width="20" height="100" fill="rgba(255, 121, 198, 0.1)" stroke="#ff79c6" stroke-width="2" rx="2" />
     <line x1="222" y1="65" x2="238" y2="65" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="80" x2="238" y2="80" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="95" x2="238" y2="95" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="110" x2="238" y2="110" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="125" x2="238" y2="125" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="140" x2="238" y2="140" stroke="#ff79c6" stroke-width="1" />
     <text x="230" y="170" fill="#a0aec0" font-size="10" font-weight="bold" text-anchor="middle">Polarizador 2 (90°)</text>
     <text x="230" y="185" fill="#a0aec0" font-size="9" text-anchor="middle">(Frestas Horizontais)</text>
   </g>
   <!-- Estado 2: Com corrente (Luz Bloqueada) -->
   <g transform="translate(420, 20)">
     <rect x="0" y="0" width="380" height="210" fill="#1e1e2e" stroke="#ff5555" stroke-width="1.5" rx="6" />
     <text x="190" y="24" fill="#ff5555" font-size="12" font-weight="bold" text-anchor="middle">Com Corrente = Luz Bloqueada (Pixel Escuro)</text>
     <!-- Raio de Luz (Bloqueado) -->
     <line x1="0" y1="100" x2="220" y2="100" stroke="#ffb86c" stroke-width="3" />
     <!-- Polarizador 1 (Vertical) -->
     <rect x="30" y="50" width="20" height="100" fill="rgba(255, 121, 198, 0.1)" stroke="#ff79c6" stroke-width="2" rx="2" />
     <line x1="36" y1="52" x2="36" y2="148" stroke="#ff79c6" stroke-width="1" />
     <line x1="40" y1="52" x2="40" y2="148" stroke="#ff79c6" stroke-width="1" />
     <line x1="44" y1="52" x2="44" y2="148" stroke="#ff79c6" stroke-width="1" />
     <text x="40" y="170" fill="#a0aec0" font-size="10" font-weight="bold" text-anchor="middle">Polarizador 1 (0°)</text>
     <text x="40" y="185" fill="#a0aec0" font-size="9" text-anchor="middle">(Frestas Verticais)</text>
     <!-- Cristal -->
     <line x1="50" y1="100" x2="220" y2="100" stroke="#8be9fd" stroke-width="3" />
     <text x="135" y="60" fill="#8be9fd" font-size="10" text-anchor="middle">Cristal Alinhado (Não dobra a luz)</text>
     <!-- Polarizador 2 (Horizontal) -->
     <rect x="220" y="50" width="20" height="100" fill="rgba(255, 121, 198, 0.1)" stroke="#ff79c6" stroke-width="2" rx="2" />
     <line x1="222" y1="65" x2="238" y2="65" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="80" x2="238" y2="80" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="95" x2="238" y2="95" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="110" x2="238" y2="110" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="125" x2="238" y2="125" stroke="#ff79c6" stroke-width="1" />
     <line x1="222" y1="140" x2="238" y2="140" stroke="#ff79c6" stroke-width="1" />
     <text x="230" y="170" fill="#a0aec0" font-size="10" font-weight="bold" text-anchor="middle">Polarizador 2 (90°)</text>
     <text x="230" y="185" fill="#a0aec0" font-size="9" text-anchor="middle">(Frestas Horizontais)</text>
     <text x="300" y="105" fill="#ff5555" font-size="14" font-weight="bold" text-anchor="middle">✖ Bloqueado</text>
   </g>
</svg>
